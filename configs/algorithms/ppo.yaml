# Proximal Policy Optimization hyperparameters (WP 4300) - passed to stable_baselines3.PPO
algorithm: PPO
policy: MlpPolicy
n_envs: 8                       # parallel environments (PPO benefits from many rollouts)
hyperparameters:
  learning_rate: 3.0e-4
  n_steps: 2048
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  policy_kwargs:
    net_arch:
      pi: [256, 256]
      vf: [256, 256]
