# RL framework definition (WP 2000) and environment settings (WP 3200)

simulation:
  dt: 0.1                       # [s] control (agent) time step
  integration_dt: 0.01          # [s] Basilisk dynamics integration step (<= dt)
  max_steps: 3000               # steps per episode (overridden per curriculum phase)

# WP 2100 - State space (all entries normalized to roughly [-1, 1], clipped to [-2, 2])
# Default: q_BR (4) + omega (3) + wheel speeds (4) + previous action (3) = 14 values per frame
observation:
  attitude: "quaternion"        # "quaternion": error quaternion q_BR (4), scalar first, q0 >= 0 (project requirement)
                                # "mrp":        sigma_BR (3), shadow set (kept for comparison)
  include_rate: true            # omega_BR_B (3), scaled by rate_scale
  include_wheel_speeds: true    # Omega (N), scaled by omega_max
  include_prev_action: true     # previous normalized action (3 for body torque): with stacking, the agent needs
                                # the torque that caused each response to infer the inertia (d_omega ~ J^-1 L dt)
  rate_scale: 0.1               # [rad/s] angular rate normalization
  stack_frames: 1               # >1 stacks the last k observations so the agent can infer the unknown inertia /
                                # disturbance from the response (Retagne et al. 2024; supervisor: worth trying).
                                # Choose k by trading performance against training cost (sweep in WP 4000).

# WP 2200 - Action space
# Supervisor decision: the agent outputs the 3-axis control torque, Basilisk's rwMotorTorque splits it across the wheels.
action:
  type: "body_torque"           # "body_torque":  3 normalized body torques, L = a * L_max -> rwMotorTorque (default)
                                # "wheel_torque": N normalized RW motor torques, u = a * u_max (kept for comparison)
  body_torque_max: null         # [N m] L_max; null = u_max (conservative: always reachable about any axis)

# WP 2300 - Reward function (weights of the individual terms)
# Scenario: large-angle rest-to-rest maneuver -> the goal requires small attitude error AND small rate.
reward:
  w_progress: 1.0               # reward for reducing the principal attitude error angle [deg]
                                # (telescoping sum = initial - final error, so oscillating does not pay off)
  w_effort: 0.01                # penalty on sum(|a_i|) of the normalized action
  w_rate: 0.0                   # penalty on |omega_BR| [rad/s] (optional extra damping term)
  w_wheel_saturation: 0.1       # penalty when any wheel exceeds saturation_ratio * omega_max
  saturation_ratio: 0.9
  goal_angle_deg: 0.25          # goal: error angle below this ...
  goal_rate: 0.01               # [rad/s] ... and rate below this (at rest)
  goal_bonus: 1.0               # per step inside the goal (cf. +9 per step in Elkins et al. 2022)
  time_penalty: 0.01            # per step outside the goal

# Early termination (WP 2300)
termination:
  max_rate: 0.2                 # [rad/s] episode ends if |omega_BR| exceeds this (spacecraft spun up)
  penalty: 100.0                # one-time penalty on termination (> any progress reward, max 180)
  # TODO: revisit max_rate once the Bevo2-Sat configuration is in configs/spacecraft.yaml

# Settling criterion (used for metrics and logging)
settling:
  angle_threshold_deg: 0.25
  rate_threshold: 0.01          # [rad/s]
