[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rl_reorientation"
version = "0.1.0"
description = "Robust reinforcement learning-based spacecraft reorientation control with Basilisk and Stable Baselines3"
readme = "README.md"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
include = ["rl_reorientation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
